<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbfbf9">
    <title th:text="${title} + ' | 한국 천연기념물 동물 도감'">한국 천연기념물 동물 도감</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="site-header" th:fragment="header">
    <div class="container header-inner">
        <a class="site-title" th:href="@{/}">
            <span class="site-mark" aria-hidden="true"></span>
            천연기념물 동물 도감
        </a>
        <nav class="site-nav">
            <a th:href="@{/monuments}">도감 목록</a>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container footer-inner">
        <p>자료 출처: 국가유산청 국가유산포털 · 자연유산(천연기념물·동물) 지정현황 (2025.06.30)</p>
        <p><a th:href="@{/credits}">사진 출처</a></p>
    </div>
</footer>

<!-- 분류/분야 badge. The CSS class comes from the enum name, e.g. badge-BIRD, badge-HABITAT -->
<span th:fragment="badge(code, label)"
      class="badge" th:classappend="'badge-' + ${code}"
      th:text="${label}">조류</span>

<!-- Photo attribution (CC BY / CC BY-SA require author + license + source) -->
<p th:fragment="credit(credit)" class="photo-credit" th:if="${credit != null}">
    사진: <a th:href="${credit.sourceUrl}" target="_blank" rel="noopener" th:text="${credit.author}">작가</a>
    · <a th:href="${credit.licenseUrl}" target="_blank" rel="noopener license" th:text="${credit.license}">CC BY 4.0</a>
</p>

</body>
</html>
